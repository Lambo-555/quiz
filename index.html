<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эзотерическое приложение для борьбы с апатией и прокрастинацией</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #4a3636;
            font-size: 2em;
            margin-bottom: 10px;
        }

        header p {
            color: #6b5a5a;
            font-size: 1.2em;
        }

        .card {
            width: 300px;
            height: 450px;
            background: linear-gradient(135deg, #fefefe 0%, #e6f0ff 100%);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: grab;
            position: relative;
            overflow: hidden;
            border: 2px solid #2e7d32;
            margin: 20px auto;
        }

        .card.dark {
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            color: white;
            border-color: #b71c1c;
        }

        .card.neutral {
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-color: #6b5a5a;
        }

        .card h3 {
            font-size: 1.4em;
            margin: 0 0 15px 0;
            text-align: center;
        }

        .card p {
            font-size: 1em;
            line-height: 1.4;
            flex-grow: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .swipe-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            color: white;
        }

        .swipe-btn.left {
            background-color: #b71c1c;
        }

        .swipe-btn.right {
            background-color: #2e7d32;
        }

        .swipe-btn:hover {
            opacity: 0.9;
        }

        .cards-counter {
            font-size: 1.2em;
            font-weight: bold;
            color: #4a3636;
            text-align: center;
            margin-bottom: 20px;
        }

        .selected-cards-preview {
            margin-top: 30px;
            text-align: center;
        }

        .selected-cards-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .selected-card {
            display: flex;
            align-items: center;
            background: #e6d6d6;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .selected-card button {
            background: none;
            border: none;
            font-size: 1.2em;
            margin-left: 8px;
            cursor: pointer;
            color: #a00;
        }

        button {
            background-color: #8b5a2b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px 5px;
        }

        button:hover {
            background-color: #a06a3d;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .reading-view {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .reading-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .reading-section h3 {
            color: #4a3636;
            margin-top: 0;
        }

        .app-controls {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Эзотерическое приложение для борьбы с апатией и прокрастинацией</h1>
            <p>Выберите до 10 карт, чтобы получить уникальное гадание</p>
        </header>

        <div id="app">
            <!-- Карточки будут добавлены здесь -->
            <div class="cards-counter">Выбрано: <span id="selected-count">0</span>/10</div>
            
            <div id="card-container">
                <div class="card dark">
                    <h3>Теневой Охотник</h3>
                    <p>Ты избегаешь конфликтов, но пора встать лицом к лицу со своими страхами. Только так ты обретешь истинную силу.</p>
                    <div class="card-actions">
                        <button class="swipe-btn left" onclick="rejectCard()">← Отклонить</button>
                        <button class="swipe-btn right" onclick="selectCard()">Выбрать →</button>
                    </div>
                </div>
            </div>
            
            <div class="app-controls">
                <button id="start-reading-btn" onclick="startReading()" disabled>Начать гадание (0/10)</button>
                
                <div class="selected-cards-preview">
                    <h3>Ваша колода:</h3>
                    <div id="selected-cards-list" class="selected-cards-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Данные карт
        const cards = [
            {
                id: 1,
                title: "Маг-Исследователь",
                description: "Ты обладаешь скрытым потенциалом, который только ждет своего проявления. Не бойся исследовать новые пути.",
                type: "light"
            },
            {
                id: 2,
                title: "Теневой Охотник",
                description: "Ты избегаешь конфликтов, но пора встать лицом к лицу со своими страхами. Только так ты обретешь истинную силу.",
                type: "dark"
            },
            {
                id: 3,
                title: "Кристалл Силы",
                description: "Этот артефакт наполнит тебя энергией для достижения целей. Используй его мудро.",
                type: "light"
            },
            {
                id: 4,
                title: "Плащ Невидимости",
                description: "Ты стремишься укрыться от ответственности. Но уход от реальности лишь усиливает твою слабость.",
                type: "dark"
            },
            {
                id: 5,
                title: "Зеркало Истины",
                description: "Ты видишь себя таким, какой ты есть. Прими свою тень, чтобы обрести целостность.",
                type: "neutral"
            },
            {
                id: 6,
                title: "Книга Забытых Знаний",
                description: "В тебе спрятаны древние знания. Пора их открыть и использовать для трансформации своей жизни.",
                type: "light"
            },
            {
                id: 7,
                title: "Клинок Разрушения",
                description: "Ты разрушаешь то, что могло бы стать основой для роста. Проверь свои мотивы и направь силу правильно.",
                type: "dark"
            },
            {
                id: 8,
                title: "Амулет Баланса",
                description: "Ты находишься на перепутье. Выбери путь гармонии между действиями и бездействием.",
                type: "neutral"
            },
            {
                id: 9,
                title: "Феникс Возрождения",
                description: "Из пепла своих неудач ты можешь восстать заново. Каждый день — это шанс начать с чистого листа.",
                type: "light"
            },
            {
                id: 10,
                title: "Теневой Клык",
                description: "Ты позволяешь негативным мыслям поглощать тебя. Остановись, прежде чем они станут твоей реальностью.",
                type: "dark"
            },
            {
                id: 11,
                title: "Компас Судьбы",
                description: "Ты потерял направление. Доверься внутреннему голосу, он укажет тебе путь.",
                type: "neutral"
            },
            {
                id: 12,
                title: "Светоч Надежды",
                description: "Даже в темноте всегда есть свет. Он указывает путь к внутренней силе и вдохновению.",
                type: "light"
            },
            {
                id: 13,
                title: "Череп Молчания",
                description: "Ты застрял в цикле бездействия. Не позволяй прошлому определять твое будущее.",
                type: "dark"
            },
            {
                id: 14,
                title: "Маска Перемен",
                description: "Ты носишь маску, чтобы скрыть свои истинные чувства. Сними её, чтобы обрести подлинную свободу.",
                type: "neutral"
            },
            {
                id: 15,
                title: "Кубок Жизни",
                description: "Ты обладаешь внутренним источником энергии. Наполняй им каждый свой день.",
                type: "light"
            },
            {
                id: 16,
                title: "Цепи Обвинений",
                description: "Ты обвиняешь других за свою бездейственность. Прими ответственность за свою жизнь.",
                type: "dark"
            },
            {
                id: 17,
                title: "Ключ Откровений",
                description: "Ты близок к откровению. Открой дверь, которую держишь закрытой слишком долго.",
                type: "neutral"
            },
            {
                id: 18,
                title: "Щит Защиты",
                description: "Ты защищаешь себя от мира, но также от возможности расти. Иногда нужно быть уязвимым.",
                type: "neutral"
            },
            {
                id: 19,
                title: "Сфера Вдохновения",
                description: "Ты забыл, что такое вдохновение. Позволь ему вернуться в твою жизнь.",
                type: "light"
            },
            {
                id: 20,
                title: "Призма Иллюзий",
                description: "Ты видишь мир через призму иллюзий. Пора взглянуть на реальность без фильтров.",
                type: "dark"
            }
        ];

        let currentIndex = 0;
        let selectedCards = [];

        // Функция для обновления счетчика выбранных карт
        function updateCounter() {
            const countElement = document.getElementById('selected-count');
            const startBtn = document.getElementById('start-reading-btn');
            countElement.textContent = selectedCards.length;
            startBtn.textContent = `Начать гадание (${selectedCards.length}/10)`;
            startBtn.disabled = selectedCards.length === 0;
        }

        // Функция для отображения текущей карты
        function showCurrentCard() {
            const cardContainer = document.getElementById('card-container');
            const card = cards[currentIndex];
            
            cardContainer.innerHTML = `
                <div class="card ${card.type}">
                    <h3>${card.title}</h3>
                    <p>${card.description}</p>
                    <div class="card-actions">
                        <button class="swipe-btn left" onclick="rejectCard()">← Отклонить</button>
                        <button class="swipe-btn right" onclick="selectCard()">Выбрать →</button>
                    </div>
                </div>
            `;
        }

        // Функция для выбора карты
        function selectCard() {
            if (selectedCards.length < 10 && !selectedCards.some(c => c.id === cards[currentIndex].id)) {
                selectedCards.push(cards[currentIndex]);
                updateSelectedCardsList();
                updateCounter();
            }
            
            nextCard();
        }

        // Функция для отклонения карты
        function rejectCard() {
            nextCard();
        }

        // Функция для перехода к следующей карте
        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            showCurrentCard();
        }

        // Функция для обновления списка выбранных карт
        function updateSelectedCardsList() {
            const listElement = document.getElementById('selected-cards-list');
            listElement.innerHTML = '';
            
            selectedCards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'selected-card';
                cardElement.innerHTML = `
                    <span>${card.title}</span>
                    <button onclick="removeCard(${card.id})">×</button>
                `;
                listElement.appendChild(cardElement);
            });
        }

        // Функция для удаления карты из списка
        function removeCard(cardId) {
            selectedCards = selectedCards.filter(card => card.id !== cardId);
            updateSelectedCardsList();
            updateCounter();
        }

        // Функция для начала гадания
        function startReading() {
            if (selectedCards.length === 0) return;
            
            // Генерация гадания
            const positiveCards = selectedCards.filter(card => card.type === 'light');
            const negativeCards = selectedCards.filter(card => card.type === 'dark');
            const neutralCards = selectedCards.filter(card => card.type === 'neutral');
            
            let readingHTML = '<h2>Ваше эзотерическое гадание</h2>';
            
            // Добавляем вступление
            readingHTML += `
                <div class="reading-section">
                    <h3>Вступление</h3>
                    <p>Вы выбрали ${selectedCards.length} карт. Это расклад отражает ваше текущее состояние и дает рекомендации для преодоления апатии и прокрастинации.</p>
                </div>
            `;
            
            // Добавляем информацию о типах карт
            if (positiveCards.length > 0) {
                readingHTML += `
                    <div class="reading-section">
                        <h3>Светлая энергия</h3>
                        <p>В вашем раскладе присутствует ${positiveCards.length} светл${positiveCards.length === 1 ? 'ая' : (positiveCards.length < 5 ? 'ые' : 'ых')} карта${positiveCards.length === 1 ? '' : (positiveCards.length < 5 ? '' : '')}, символизирующих позитивные аспекты вашей ситуации. Это источники внутренней силы и вдохновения.</p>
                    </div>
                `;
            }

            if (negativeCards.length > 0) {
                readingHTML += `
                    <div class="reading-section">
                        <h3>Теневые аспекты</h3>
                        <p>В вашем раскладе присутствует ${negativeCards.length} тёмн${negativeCards.length === 1 ? 'ая' : (negativeCards.length < 5 ? 'ые' : 'ых')} карта${negativeCards.length === 1 ? '' : (negativeCards.length < 5 ? '' : '')}, указывающ${negativeCards.length === 1 ? 'ая' : (negativeCards.length < 5 ? 'ие' : 'ие')} на возможные препятствия или страхи. Работа с этими аспектами поможет вам освободиться от негативных влияний.</p>
                    </div>
                `;
            }

            if (neutralCards.length > 0) {
                readingHTML += `
                    <div class="reading-section">
                        <h3>Балансирующие силы</h3>
                        <p>В вашем раскладе присутствует ${neutralCards.length} нейтральн${neutralCards.length === 1 ? 'ая' : (neutralCards.length < 5 ? 'ые' : 'ых')} карта${neutralCards.length === 1 ? '' : (neutralCards.length < 5 ? '' : '')}, которая${neutralCards.length === 1 ? '' : (neutralCards.length < 5 ? 'е' : 'й')} может${neutralCards.length === 1 ? '' : (neutralCards.length < 5 ? '' : '')} служить${neutralCards.length === 1 ? '' : (neutralCards.length < 5 ? 'ть' : 'ть')} точкой равновесия между светлыми и тёмными силами.</p>
                    </div>
                `;
            }
            
            // Добавляем интерпретацию каждой карты
            selectedCards.forEach((card, index) => {
                readingHTML += `
                    <div class="reading-section">
                        <h3>${index + 1}. ${card.title}</h3>
                        <p>"${card.description}" - Эта карта указывает на важный аспект вашей ситуации. Она может содержать ключ к пониманию вашего внутреннего состояния и возможных путей развития событий.</p>
                    </div>
                `;
            });
            
            // Добавляем рекомендацию
            readingHTML += `
                <div class="reading-section">
                    <h3>Рекомендация</h3>
                    <p>Для преодоления апатии и прокрастинации важно использовать энергию светлых карт как источник вдохновения и мотивации, при этом работать с теневыми аспектами, чтобы устранить внутренние блоки. Нейтральные карты помогут найти баланс и принять решения.</p>
                </div>
            `;
            
            // Обновляем контент страницы
            document.getElementById('app').innerHTML = `
                <div class="reading-view">
                    ${readingHTML}
                </div>
                <div class="app-controls">
                    <button onclick="resetApp()">Новый выбор карт</button>
                </div>
            `;
        }

        // Функция для сброса приложения
        function resetApp() {
            selectedCards = [];
            currentIndex = 0;
            updateCounter();
            updateSelectedCardsList();
            
            document.getElementById('app').innerHTML = `
                <div class="cards-counter">Выбрано: <span id="selected-count">0</span>/10</div>
                
                <div id="card-container">
                    <div class="card dark">
                        <h3>Теневой Охотник</h3>
                        <p>Ты избегаешь конфликтов, но пора встать лицом к лицу со своими страхами. Только так ты обретешь истинную силу.</p>
                        <div class="card-actions">
                            <button class="swipe-btn left" onclick="rejectCard()">← Отклонить</button>
                            <button class="swipe-btn right" onclick="selectCard()">Выбрать →</button>
                        </div>
                    </div>
                </div>
                
                <div class="app-controls">
                    <button id="start-reading-btn" onclick="startReading()" disabled>Начать гадание (0/10)</button>
                    
                    <div class="selected-cards-preview">
                        <h3>Ваша колода:</h3>
                        <div id="selected-cards-list" class="selected-cards-list"></div>
                    </div>
                </div>
            `;
            
            showCurrentCard();
        }

        // Инициализация при загрузке
        window.onload = function() {
            showCurrentCard();
            updateCounter();
        };
    </script>
</body>
</html>
